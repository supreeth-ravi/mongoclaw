name: LiteLLM Upgrade Compatibility Check

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  litellm-upgrade-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Sync project deps
        run: uv sync --extra dev

      - name: Upgrade LiteLLM to latest
        run: uv run python -m pip install --upgrade litellm

      - name: Run unit tests
        run: uv run python -m pytest tests/unit -q
