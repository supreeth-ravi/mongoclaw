id: method_dyn_agent
name: Method Dynamic Agent
watch:
  database: support_dyn
  collection: tickets
  operations: [insert]
  filter:
    status: open
ai:
  provider: openai
  model: gpt-4o-mini
  prompt: |
    Classify this support ticket:
    Title: {{ document.title }}
    Description: {{ document.description }}
  response_schema:
    type: object
    properties:
      category:
        type: string
      priority:
        type: string
    required: [category, priority]
  extra_params:
    mock_response: '{"category":"general","priority":"low"}'
write:
  strategy: merge
enabled: true
