id: method_node_agent
name: Method Node Agent
watch:
  database: support_node
  collection: tickets
  operations: [insert]
  filter:
    status: open
ai:
  provider: openai
  model: gpt-4o-mini
  prompt: |
    Classify:
    {{ document.title }}
  response_schema:
    type: object
    properties:
      category:
        type: string
      priority:
        type: string
    required: [category, priority]
  extra_params:
    mock_response: '{"category":"sales","priority":"medium"}'
write:
  strategy: merge
  target_field: ai_classification
enabled: true
