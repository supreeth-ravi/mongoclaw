<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MongoClaw Before and After</title>
  <desc id="desc">Comparison showing a raw support ticket document before enrichment and a structured AI enriched document after MongoClaw processing.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .h1 { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 2; rx: 16; }
      .ph { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .before { fill: #9f1239; }
      .after { fill: #065f46; }
      .mono { font: 500 16px "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #0f172a; }
      .arrow { stroke: #0ea5e9; stroke-width: 6; marker-end: url(#arrowhead); fill: none; }
      .chip { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1.5; rx: 10; }
      .chipTxt { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #075985; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="h1" x="60" y="70">Before vs After MongoClaw Enrichment</text>
  <text class="sub" x="60" y="105">Raw event payload becomes structured, policy-aware, and query-friendly output</text>

  <rect class="panel" x="60" y="150" width="500" height="540"/>
  <text class="ph before" x="90" y="200">Before (Raw Document)</text>
  <text class="mono" x="90" y="250">{</text>
  <text class="mono" x="90" y="284">  "title": "Can't access my account",</text>
  <text class="mono" x="90" y="318">  "description": "Locked out after retries",</text>
  <text class="mono" x="90" y="352">  "status": "open",</text>
  <text class="mono" x="90" y="386">  "channel": "email"</text>
  <text class="mono" x="90" y="420">}</text>

  <rect class="chip" x="90" y="470" width="320" height="38"/>
  <text class="chipTxt" x="110" y="495">No category, no priority, no metadata</text>

  <rect class="panel" x="640" y="150" width="500" height="540"/>
  <text class="ph after" x="670" y="200">After (Enriched by MongoClaw)</text>
  <text class="mono" x="670" y="250">{</text>
  <text class="mono" x="670" y="284">  "title": "Can't access my account",</text>
  <text class="mono" x="670" y="318">  "description": "Locked out after retries",</text>
  <text class="mono" x="670" y="352">  "status": "open",</text>
  <text class="mono" x="670" y="386">  "channel": "email",</text>
  <text class="mono" x="670" y="420">  "ai_classification": {</text>
  <text class="mono" x="670" y="454">    "category": "technical",</text>
  <text class="mono" x="670" y="488">    "priority": "high"</text>
  <text class="mono" x="670" y="522">  },</text>
  <text class="mono" x="670" y="556">  "_ai_metadata": {</text>
  <text class="mono" x="670" y="590">    "source_agent_id": "ticket_classifier"</text>
  <text class="mono" x="670" y="624">  }</text>
  <text class="mono" x="670" y="658">}</text>

  <path class="arrow" d="M 570 420 C 620 420, 620 420, 630 420"/>
  <rect class="chip" x="520" y="360" width="180" height="38"/>
  <text class="chipTxt" x="550" y="385">watch -> queue -> AI -> write</text>
</svg>
